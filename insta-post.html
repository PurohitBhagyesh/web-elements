<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poster assets removed</title>
  <style>
    :root {
      --bg: #090a0f;
      --card: #12141c;
      --line: rgba(255,255,255,0.08);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #22c55e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, rgba(34,197,94,0.12), transparent 38%), var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 20px;
    }
    .card {
      width: min(680px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      padding: 32px 28px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      border: 1px solid rgba(34,197,94,0.35);
      background: rgba(34,197,94,0.12);
      color: var(--accent);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.1;
    }
    p {
      margin: 0 auto 26px;
      max-width: 52ch;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-weight: 700;
      border-radius: 10px;
      padding: 12px 18px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    a:hover { transform: translateY(-1px); }
    .primary {
      background: var(--accent);
      color: #03130a;
    }
    .secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">Repo cleanup</div>
    <h1>Poster assets removed</h1>
    <p>This repository is now focused on the live widgets and developer experience. The marketing poster assets were removed in favor of the cleaner product demo and code-first workflow.</p>
    <div class="actions">
      <a class="primary" href="https://github.com/PurohitBhagyesh/web-elements">Open repo</a>
      <a class="secondary" href="index.html">Open live demo</a>
    </div>
  </main>
</body>
</html>
