<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Elements - Instagram Post Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 16px;
    }
    .preview-box {
      max-width: 540px;
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 40px rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .preview-box img {
      width: 100%;
      height: auto;
      display: block;
    }
    .actions {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      background: #22c55e;
      color: #000;
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-secondary {
      background: #161b26;
      color: #f0f6fc;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>
  <div class="preview-box">
    <img src="insta-post.png" alt="Web Elements Instagram Post" width="1080" height="1350">
  </div>
  <div class="actions">
    <a href="insta-post.png" download="web-elements-insta-post.png" class="btn">Download Standard (1080x1350)</a>
    <a href="insta-post-hd.png" download="web-elements-insta-post-hd.png" class="btn btn-secondary">Download 2x HD (1728x2160)</a>
    <a href="insta-post.svg" target="_blank" class="btn btn-secondary">View Vector SVG</a>
  </div>
</body>
</html>
