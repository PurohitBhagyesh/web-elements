<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <!-- Warm Skin / Cream / Sand Background Gradient -->
    <linearGradient id="bgSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf6f0"/>
      <stop offset="40%" stop-color="#f5efe6"/>
      <stop offset="100%" stop-color="#ede3d5"/>
    </linearGradient>

    <!-- Fresh Matcha / Forest Green Gradient -->
    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <!-- Warm White Floating Card Background -->
    <linearGradient id="whiteCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fdfbf9" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Soft Ambient Warm & Green Radial Lighting -->
    <radialGradient id="glowMatcha" cx="15%" cy="18%" r="48%">
      <stop offset="0%" stop-color="#86efac" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#86efac" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowLatte" cx="85%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#fed7aa" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCenter" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D Coffee Bean Gradient (Warm Roasted Coffee Hue) -->
    <linearGradient id="beanGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a3528"/>
      <stop offset="50%" stop-color="#342217"/>
      <stop offset="100%" stop-color="#20130c"/>
    </linearGradient>

    <linearGradient id="beanGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a4233"/>
      <stop offset="100%" stop-color="#3b281d"/>
    </linearGradient>

    <!-- Card Drop Shadow for 3D Depth -->
    <filter id="shadowCard" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#2b2118" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#2b2118" flood-opacity="0.05"/>
    </filter>

    <filter id="shadowBean" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#302015" flood-opacity="0.15"/>
    </filter>

    <filter id="blurSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <!-- 1:1 Base Background -->
  <rect width="1080" height="1080" fill="url(#bgSkin)"/>
  <rect width="1080" height="1080" fill="url(#glowCenter)"/>
  <rect width="1080" height="1080" fill="url(#glowMatcha)"/>
  <rect width="1080" height="1080" fill="url(#glowLatte)"/>

  <!-- ===================================================================== -->
  <!-- AESTHETIC BACKGROUND: COFFEE BEANS & BOBA CUP NICELY COMPOSED          -->
  <!-- ===================================================================== -->
  
  <!-- Subtle Minimalist Boba Glass Outline (Right Background) -->
  <g transform="translate(760, 180) rotate(8)" opacity="0.16">
    <!-- Straw -->
    <g transform="rotate(-18, 110, 60)">
      <rect x="100" y="-40" width="20" height="260" rx="10" fill="#15803d"/>
    </g>
    <!-- Cup Rim & Body -->
    <ellipse cx="110" cy="70" rx="90" ry="16" fill="none" stroke="#2b2118" stroke-width="2.5"/>
    <path d="M24 70 L48 380 Q52 400 74 400 L146 400 Q168 400 172 380 L196 70"
          fill="none" stroke="#2b2118" stroke-width="2.5"/>
    <!-- Boba Pearls at bottom of cup -->
    <circle cx="80" cy="350" r="14" fill="#342217"/>
    <circle cx="110" cy="365" r="15" fill="#342217"/>
    <circle cx="140" cy="355" r="14" fill="#342217"/>
    <circle cx="95" cy="325" r="13" fill="#342217"/>
    <circle cx="125" cy="335" r="14" fill="#342217"/>
  </g>

  <!-- Floating 3D Roasted Coffee Beans (Nicely scattered at aesthetic angles) -->
  <!-- Bean 1: Top Right Floating -->
  <g transform="translate(940, 110) rotate(32)" filter="url(#shadowBean)" opacity="0.85">
    <path d="M 0 -30 C 22 -30, 30 -10, 30 0 C 30 10, 22 30, 0 30 C -22 30, -30 10, -30 0 C -30 -10, -22 -30, 0 -30 Z" fill="url(#beanGrad1)"/>
    <path d="M 0 -26 Q -8 -8, 0 0 Q 8 8, 0 26" stroke="#f5ede0" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.75"/>
    <ellipse cx="-8" cy="-10" rx="5" ry="10" fill="#ffffff" opacity="0.18" transform="rotate(-20, -8, -10)"/>
  </g>

  <!-- Bean 2: Top Left Ambient (Soft focus) -->
  <g transform="translate(80, 120) rotate(-40)" filter="url(#blurSoft)" opacity="0.45">
    <path d="M 0 -24 C 18 -24, 24 -8, 24 0 C 24 8, 18 24, 0 24 C -18 24, -24 8, -24 0 C -24 -8, -18 -24, 0 -24 Z" fill="url(#beanGrad2)"/>
    <path d="M 0 -20 Q -6 -6, 0 0 Q 6 6, 0 20" stroke="#f5ede0" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Bean 3: Middle Right Floating -->
  <g transform="translate(990, 520) rotate(-22)" filter="url(#shadowBean)" opacity="0.8">
    <path d="M 0 -26 C 20 -26, 26 -9, 26 0 C 26 9, 20 26, 0 26 C -20 26, -26 9, -26 0 C -26 -9, -20 -26, 0 -26 Z" fill="url(#beanGrad1)"/>
    <path d="M 0 -22 Q -7 -7, 0 0 Q 7 7, 0 22" stroke="#f5ede0" stroke-width="2.8" fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Bean 4: Bottom Left Floating Accent -->
  <g transform="translate(90, 920) rotate(55)" filter="url(#shadowBean)" opacity="0.85">
    <path d="M 0 -28 C 21 -28, 28 -10, 28 0 C 28 10, 21 28, 0 28 C -21 28, -28 10, -28 0 C -28 -10, -21 -28, 0 -28 Z" fill="url(#beanGrad2)"/>
    <path d="M 0 -24 Q -7 -7, 0 0 Q 7 7, 0 24" stroke="#f5ede0" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- Bean 5: Bottom Right Foreground Floating -->
  <g transform="translate(960, 960) rotate(-65)" filter="url(#shadowBean)" opacity="0.75">
    <path d="M 0 -22 C 16 -22, 22 -8, 22 0 C 22 8, 16 22, 0 22 C -16 22, -22 8, -22 0 C -22 -8, -16 -22, 0 -22 Z" fill="url(#beanGrad1)"/>
    <path d="M 0 -19 Q -6 -6, 0 0 Q 6 6, 0 19" stroke="#f5ede0" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- ===================================================================== -->
  <!-- TOP HEADER BAR                                                        -->
  <!-- ===================================================================== -->
  <g transform="translate(80, 70)">
    <!-- Brand Pill (Skin & Green Accent) -->
    <rect width="186" height="38" rx="19" fill="#ffffff" stroke="#e5ded2" stroke-width="1.2" filter="url(#shadowCard)"/>
    <circle cx="22" cy="19" r="5" fill="#16a34a"/>
    <text x="36" y="23.5" fill="#1c1917" class="sans" font-size="12" font-weight="800" letter-spacing="0.08em">WEB ELEMENTS</text>

    <!-- Category Pill -->
    <g transform="translate(670, 0)">
      <rect width="250" height="38" rx="19" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
      <text x="125" y="23.5" fill="#15803d" class="sans" font-size="11.5" font-weight="800" text-anchor="middle" letter-spacing="0.06em">FOR INDIE DEVELOPERS</text>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- HERO HEADLINE                                                         -->
  <!-- ===================================================================== -->
  <g transform="translate(80, 142)">
    <text x="0" y="20" fill="#16a34a" class="sans" font-size="12" font-weight="800" letter-spacing="0.14em">DIRECT PEER-TO-PEER PAYMENTS &amp; SOCIAL SHARE</text>
    <text x="0" y="72" fill="#1c1917" class="sans" font-size="48" font-weight="900" letter-spacing="-0.03em">Buy Me a Coffee (UPI)</text>
    <text x="0" y="106" fill="#645e54" class="sans" font-size="17" font-weight="500">
      Zero platform fees. Instant peer-to-peer settlement directly to your bank account.
    </text>
  </g>

  <!-- ===================================================================== -->
  <!-- 2 CORE FLOATING CARDS (1:1 OPTIMIZED SPACING)                         -->
  <!-- ===================================================================== -->

  <!-- CARD 1: BUY ME A COFFEE (UPI) -->
  <g transform="translate(80, 275)" filter="url(#shadowCard)">
    <!-- Clean White Premium Container -->
    <rect width="920" height="320" rx="24" fill="url(#whiteCard)" stroke="#e8e0d4" stroke-width="1.5"/>

    <g transform="translate(44, 38)">
      <!-- Eyebrow Tag -->
      <g>
        <rect width="180" height="28" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
        <text x="90" y="18" fill="#15803d" class="sans" font-size="11" font-weight="800" text-anchor="middle">0% PLATFORM COMMISSIONS</text>
      </g>

      <!-- Headline -->
      <text x="0" y="66" fill="#1c1917" class="sans" font-size="28" font-weight="800" letter-spacing="-0.02em">Buy Me a Coffee (UPI)</text>
      <text x="0" y="96" fill="#645e54" class="sans" font-size="15" font-weight="500">
        Direct peer-to-peer donations with instant bank credit. No merchant KYC or platform lock-in.
      </text>

      <!-- Clean Feature Row -->
      <g transform="translate(0, 126)">
        <g transform="translate(0, 0)">
          <circle cx="8" cy="8" r="4" fill="#16a34a"/>
          <text x="22" y="12" fill="#292524" class="sans" font-size="14" font-weight="700">Dynamic amount-synced QR code in real time</text>
        </g>
        <g transform="translate(420, 0)">
          <circle cx="8" cy="8" r="4" fill="#16a34a"/>
          <text x="22" y="12" fill="#292524" class="sans" font-size="14" font-weight="700">Live editable Payee Name &amp; UPI ID via UI</text>
        </g>
      </g>

      <!-- Supported UPI Apps Box (As Requested) -->
      <g transform="translate(0, 180)">
        <rect width="832" height="52" rx="14" fill="#fbf8f4" stroke="#e8e0d4" stroke-width="1.2"/>
        <g transform="translate(24, 30)">
          <text x="0" y="2" fill="#15803d" class="sans" font-size="13.5" font-weight="800" letter-spacing="0.04em">Supported UPI Apps</text>
          <text x="784" y="2" fill="#57534e" class="sans" font-size="13" font-weight="600" text-anchor="end">
            FamApp • PhonePe • Google Pay • Paytm • Amazon Pay • WhatsApp • BHIM
          </text>
        </g>
      </g>
    </g>
  </g>

  <!-- CARD 2: NATIVE WEB SHARE LINK -->
  <g transform="translate(80, 625)" filter="url(#shadowCard)">
    <!-- Clean White Premium Container -->
    <rect width="920" height="270" rx="24" fill="url(#whiteCard)" stroke="#e8e0d4" stroke-width="1.5"/>

    <g transform="translate(44, 38)">
      <!-- Eyebrow Tag -->
      <g>
        <rect width="170" height="28" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
        <text x="85" y="18" fill="#15803d" class="sans" font-size="11" font-weight="800" text-anchor="middle">VIRAL DISTRIBUTION</text>
      </g>

      <!-- Headline -->
      <text x="0" y="66" fill="#1c1917" class="sans" font-size="28" font-weight="800" letter-spacing="-0.02em">Native Web Share Link</text>
      <text x="0" y="96" fill="#645e54" class="sans" font-size="15" font-weight="500">
        Invokes native OS share sheets on iOS, Android &amp; macOS Safari with 1-click clipboard copy.
      </text>

      <!-- Channels Pills in Fresh Green & Clean White Palette -->
      <g transform="translate(0, 130)">
        <rect x="0" y="0" width="118" height="40" rx="10" fill="#f5efe6" stroke="#e2d8c9" stroke-width="1"/>
        <text x="59" y="25" fill="#292524" class="sans" font-size="13" font-weight="700" text-anchor="middle">AirDrop</text>

        <rect x="130" y="0" width="134" height="40" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
        <text x="197" y="25" fill="#15803d" class="sans" font-size="13" font-weight="700" text-anchor="middle">WhatsApp</text>

        <rect x="276" y="0" width="124" height="40" rx="10" fill="#f5efe6" stroke="#e2d8c9" stroke-width="1"/>
        <text x="338" y="25" fill="#292524" class="sans" font-size="13" font-weight="700" text-anchor="middle">X / Twitter</text>

        <rect x="412" y="0" width="124" height="40" rx="10" fill="#f5efe6" stroke="#e2d8c9" stroke-width="1"/>
        <text x="474" y="25" fill="#292524" class="sans" font-size="13" font-weight="700" text-anchor="middle">LinkedIn</text>

        <rect x="548" y="0" width="118" height="40" rx="10" fill="#f5efe6" stroke="#e2d8c9" stroke-width="1"/>
        <text x="607" y="25" fill="#292524" class="sans" font-size="13" font-weight="700" text-anchor="middle">Telegram</text>

        <rect x="678" y="0" width="154" height="40" rx="10" fill="#16a34a"/>
        <text x="755" y="25" fill="#ffffff" class="sans" font-size="13" font-weight="800" text-anchor="middle">1-Click Copy</text>
      </g>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- SMALL MINIMAL FOOTER                                                  -->
  <!-- ===================================================================== -->
  <g transform="translate(80, 930)">
    <line x1="0" y1="0" x2="920" y2="0" stroke="#e5ded2" stroke-width="1.2"/>

    <g transform="translate(0, 32)">
      <!-- Left: Small Clean Repo URL -->
      <text x="0" y="16" fill="#8c8275" class="sans" font-size="11" font-weight="800" letter-spacing="0.08em">OPEN SOURCE REPOSITORY</text>
      <text x="0" y="44" fill="#1c1917" class="mono" font-size="18" font-weight="700">github.com/PurohitBhagyesh/web-elements</text>

      <!-- Right: Developer Handle -->
      <g transform="translate(680, 0)">
        <text x="240" y="16" fill="#8c8275" class="sans" font-size="11" font-weight="800" text-anchor="end" letter-spacing="0.08em">DEVELOPER</text>
        <text x="240" y="44" fill="#15803d" class="sans" font-size="18" font-weight="800" text-anchor="end">@PurohitBhagyesh</text>
      </g>
    </g>
  </g>

  <!-- Bottom Footnote -->
  <text x="540" y="1045" fill="#a89f91" class="sans" font-size="11.5" font-weight="600" text-anchor="middle">
    Free &amp; Open Source MIT • Zero Runtime Dependencies • Pure Vanilla JS &amp; CSS3
  </text>
</svg>
