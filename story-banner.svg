<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="50%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>

    <linearGradient id="coffeeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>

    <linearGradient id="shareGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b26" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f131c" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="glowCoffee" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="blurGlow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="blurGlow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="110"/>
    </filter>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Deep Dark Canvas -->
  <rect width="1080" height="1920" fill="url(#bg)"/>

  <!-- Ambient Ambient Glow Orbs -->
  <circle cx="200" cy="450" r="320" fill="url(#glowCoffee)" filter="url(#blurGlow1)"/>
  <circle cx="880" cy="1150" r="300" fill="url(#glowBlue)" filter="url(#blurGlow2)"/>
  <circle cx="540" cy="1700" r="280" fill="url(#glowCoffee)" filter="url(#blurGlow1)"/>

  <!-- Subtle Grid Accent -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="240" x2="1080" y2="240"/>
    <line x1="0" y1="480" x2="1080" y2="480"/>
    <line x1="0" y1="720" x2="1080" y2="720"/>
    <line x1="0" y1="960" x2="1080" y2="960"/>
    <line x1="0" y1="1200" x2="1080" y2="1200"/>
    <line x1="0" y1="1440" x2="1080" y2="1440"/>
    <line x1="0" y1="1680" x2="1080" y2="1680"/>
    <line x1="270" y1="0" x2="270" y2="1920"/>
    <line x1="540" y1="0" x2="540" y2="1920"/>
    <line x1="810" y1="0" x2="810" y2="1920"/>
  </g>

  <!-- TOP BAR: GitHub Profile Badge -->
  <g transform="translate(80, 110)">
    <!-- GitHub Icon Pill -->
    <rect width="380" height="58" rx="29" fill="#161b26" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <!-- GitHub Octocat Mark -->
    <path d="M36 29c0-8.84-7.16-16-16-16s-16 7.16-16 16c0 7.07 4.58 13.07 10.94 15.19.8.15 1.09-.35 1.09-.77 0-.38-.01-1.39-.02-2.73-4.45.97-5.39-2.15-5.39-2.15-.73-1.85-1.78-2.34-1.78-2.34-1.45-.99.11-.97.11-.97 1.6.11 2.45 1.65 2.45 1.65 1.43 2.44 3.74 1.74 4.66 1.33.14-1.03.56-1.74 1.01-2.14-3.55-.4-7.29-1.78-7.29-7.91 0-1.75.62-3.17 1.65-4.29-.16-.4-.72-2.03.16-4.23 0 0 1.34-.43 4.4 1.64 1.28-.36 2.65-.53 4.01-.54 1.36.01 2.73.18 4.01.54 3.05-2.07 4.39-1.64 4.39-1.64.88 2.2.32 3.83.16 4.23 1.03 1.12 1.64 2.54 1.64 4.29 0 6.15-3.74 7.5-7.31 7.89.58.5 1.09 1.48 1.09 2.98 0 2.15-.02 3.89-.02 4.42 0 .43.29.93 1.1.77C31.42 42.06 36 36.07 36 29z" fill="#f0f6fc" transform="translate(18, 0) scale(0.9)"/>
    <text x="64" y="36" fill="#f0f6fc" class="sans" font-size="19" font-weight="700">github.com/PurohitBhagyesh</text>

    <!-- Tag on the right -->
    <rect x="630" y="0" width="290" height="58" rx="29" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.3)" stroke-width="1.5"/>
    <text x="775" y="36" fill="#22c55e" class="sans" font-size="17" font-weight="700" text-anchor="middle">⚡ FOR INDIE HACKERS</text>
  </g>

  <!-- HERO TITLE SECTION -->
  <g transform="translate(80, 240)">
    <!-- Pill Tag -->
    <rect width="260" height="44" rx="22" fill="rgba(34,197,94,0.15)" stroke="rgba(34,197,94,0.35)" stroke-width="1.5"/>
    <text x="130" y="28" fill="#4ade80" class="sans" font-size="16" font-weight="700" text-anchor="middle">ZERO-DEPENDENCY WIDGETS</text>

    <!-- Main Title -->
    <text x="0" y="110" fill="#ffffff" class="sans" font-size="64" font-weight="900" letter-spacing="-1.5">Web Elements</text>
    <text x="0" y="170" fill="url(#coffeeGrad)" class="sans" font-size="44" font-weight="800">Built for Indie Developers</text>
    <text x="0" y="215" fill="#94a3b8" class="sans" font-size="22" font-weight="400">Stop paying 5% platform fees. Receive 100% of support instantly.</text>
  </g>

  <!-- BIG CARD 1: BUY ME A COFFEE (UPI) -->
  <g transform="translate(80, 520)">
    <!-- Glassmorphic Card Container -->
    <rect width="920" height="510" rx="32" fill="url(#cardGrad)" stroke="rgba(34,197,94,0.3)" stroke-width="2"/>

    <!-- Coffee Icon Badge -->
    <rect x="40" y="40" width="76" height="76" rx="20" fill="rgba(245,158,11,0.18)"/>
    <text x="78" y="90" font-size="40" text-anchor="middle">☕</text>

    <!-- Big Headline -->
    <text x="136" y="78" fill="#ffffff" class="sans" font-size="34" font-weight="800">BUY ME A COFFEE (UPI)</text>
    <text x="136" y="108" fill="#22c55e" class="sans" font-size="20" font-weight="700">0% Platform Cut • Direct Bank Settlement • Pure Vanilla JS</text>

    <!-- Feature Checklist -->
    <g transform="translate(44, 150)">
      <!-- Item 1 -->
      <circle cx="12" cy="16" r="10" fill="#22c55e"/>
      <path d="M8 16l3 3 5-5" stroke="#000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="34" y="22" fill="#f8fafc" class="sans" font-size="21" font-weight="600">Dynamic Amount-Synced QR Code in Real Time</text>

      <!-- Item 2 -->
      <circle cx="12" cy="62" r="10" fill="#22c55e"/>
      <path d="M8 62l3 3 5-5" stroke="#000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="34" y="68" fill="#f8fafc" class="sans" font-size="21" font-weight="600">1-Click Mobile App Links: FamApp, PhonePe, Paytm, GPay, Amazon</text>

      <!-- Item 3 -->
      <circle cx="12" cy="108" r="10" fill="#22c55e"/>
      <path d="M8 108l3 3 5-5" stroke="#000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="34" y="114" fill="#f8fafc" class="sans" font-size="21" font-weight="600">Live Editable Name &amp; UPI ID via UI ✎ or JavaScript API</text>

      <!-- Item 4 -->
      <circle cx="12" cy="154" r="10" fill="#22c55e"/>
      <path d="M8 154l3 3 5-5" stroke="#000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="34" y="160" fill="#f8fafc" class="sans" font-size="21" font-weight="600">No Merchant KYC or Third-Party Account Required</text>
    </g>

    <!-- App Badges Row -->
    <g transform="translate(44, 350)">
      <!-- FamApp -->
      <rect x="0" y="0" width="128" height="48" rx="12" fill="#1f2430" stroke="rgba(255,255,255,0.08)"/>
      <text x="64" y="30" fill="#f59e0b" class="sans" font-size="16" font-weight="700" text-anchor="middle">FamApp</text>

      <!-- PhonePe -->
      <rect x="140" y="0" width="128" height="48" rx="12" fill="#1f2430" stroke="rgba(255,255,255,0.08)"/>
      <text x="204" y="30" fill="#a855f7" class="sans" font-size="16" font-weight="700" text-anchor="middle">PhonePe</text>

      <!-- Google Pay -->
      <rect x="280" y="0" width="128" height="48" rx="12" fill="#1f2430" stroke="rgba(255,255,255,0.08)"/>
      <text x="344" y="30" fill="#38bdf8" class="sans" font-size="16" font-weight="700" text-anchor="middle">GPay</text>

      <!-- Paytm -->
      <rect x="420" y="0" width="128" height="48" rx="12" fill="#1f2430" stroke="rgba(255,255,255,0.08)"/>
      <text x="484" y="30" fill="#0284c7" class="sans" font-size="16" font-weight="700" text-anchor="middle">Paytm</text>

      <!-- Amazon Pay -->
      <rect x="560" y="0" width="128" height="48" rx="12" fill="#1f2430" stroke="rgba(255,255,255,0.08)"/>
      <text x="624" y="30" fill="#f97316" class="sans" font-size="16" font-weight="700" text-anchor="middle">Amazon</text>

      <!-- WhatsApp -->
      <rect x="700" y="0" width="132" height="48" rx="12" fill="#1f2430" stroke="rgba(255,255,255,0.08)"/>
      <text x="766" y="30" fill="#22c55e" class="sans" font-size="16" font-weight="700" text-anchor="middle">WhatsApp</text>
    </g>

    <!-- Preset Amount Chips Preview -->
    <g transform="translate(44, 424)">
      <rect x="0" y="0" width="190" height="46" rx="23" fill="#22c55e"/>
      <text x="95" y="29" fill="#000000" class="sans" font-size="17" font-weight="800" text-anchor="middle">₹50 (1 Coffee)</text>

      <rect x="206" y="0" width="140" height="46" rx="23" fill="#1a202c" stroke="rgba(255,255,255,0.1)"/>
      <text x="276" y="29" fill="#cbd5e1" class="sans" font-size="17" font-weight="600" text-anchor="middle">₹100</text>

      <rect x="360" y="0" width="140" height="46" rx="23" fill="#1a202c" stroke="rgba(255,255,255,0.1)"/>
      <text x="430" y="29" fill="#cbd5e1" class="sans" font-size="17" font-weight="600" text-anchor="middle">₹200</text>

      <rect x="514" y="0" width="318" height="46" rx="23" fill="#131722" stroke="rgba(34,197,94,0.3)"/>
      <text x="673" y="29" fill="#4ade80" class="sans" font-size="16" font-weight="600" text-anchor="middle">100% Goes To Bank ⚡</text>
    </g>
  </g>

  <!-- CARD 2: NATIVE WEB SHARE LINK -->
  <g transform="translate(80, 1060)">
    <rect width="920" height="300" rx="32" fill="url(#cardGrad)" stroke="rgba(59,130,246,0.3)" stroke-width="2"/>

    <rect x="40" y="40" width="76" height="76" rx="20" fill="rgba(59,130,246,0.18)"/>
    <text x="78" y="90" font-size="40" text-anchor="middle">🚀</text>

    <text x="136" y="78" fill="#ffffff" class="sans" font-size="34" font-weight="800">NATIVE WEB SHARE LINK</text>
    <text x="136" y="108" fill="#60a5fa" class="sans" font-size="20" font-weight="700">Native OS Share Sheet • 1-Click Link Copy • Social Quicklinks</text>

    <g transform="translate(44, 150)">
      <circle cx="12" cy="16" r="10" fill="#3b82f6"/>
      <path d="M8 16l3 3 5-5" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="34" y="22" fill="#f8fafc" class="sans" font-size="21" font-weight="600">AirDrop, Messages, Device Sheet on iOS, Android &amp; macOS</text>

      <circle cx="12" cy="62" r="10" fill="#3b82f6"/>
      <path d="M8 62l3 3 5-5" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="34" y="68" fill="#f8fafc" class="sans" font-size="21" font-weight="600">Social Quicklinks: WhatsApp, X (Twitter), LinkedIn, Reddit, Telegram</text>

      <circle cx="12" cy="108" r="10" fill="#3b82f6"/>
      <path d="M8 108l3 3 5-5" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="34" y="114" fill="#f8fafc" class="sans" font-size="21" font-weight="600">1-Click Clipboard Copy with animated confirmation</text>
    </g>
  </g>

  <!-- 1-LINE TERMINAL INSTALL COMMAND -->
  <g transform="translate(80, 1390)">
    <rect width="920" height="150" rx="24" fill="#0d1117" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

    <!-- Terminal Window Dots -->
    <circle cx="34" cy="30" r="6" fill="#ff5f56"/>
    <circle cx="54" cy="30" r="6" fill="#ffbd2e"/>
    <circle cx="74" cy="30" r="6" fill="#27c93f"/>
    <text x="100" y="34" fill="#8b949e" class="mono" font-size="14">terminal — 1-line install</text>

    <!-- Command line text -->
    <text x="34" y="95" fill="#38bdf8" class="mono" font-size="20" font-weight="600">curl -sSL https://raw.githubusercontent.com/.../install.sh | bash</text>
    <text x="34" y="125" fill="#94a3b8" class="sans" font-size="16">Auto-installs into your project • Zero npm packages • Pure plug &amp; play</text>
  </g>

  <!-- REPO LINK & CTA FOOTER -->
  <g transform="translate(80, 1570)">
    <!-- Primary CTA Button Box -->
    <rect width="920" height="210" rx="30" fill="url(#cardGrad)" stroke="rgba(34,197,94,0.4)" stroke-width="2"/>

    <!-- Glowing Star Icon -->
    <text x="80" y="85" font-size="44">⭐</text>
    <text x="140" y="70" fill="#ffffff" class="sans" font-size="34" font-weight="900">STAR ON GITHUB</text>
    <text x="140" y="104" fill="#22c55e" class="mono" font-size="22" font-weight="700">github.com/PurohitBhagyesh/web-elements</text>

    <!-- Bottom subtext -->
    <rect x="40" y="136" width="840" height="50" rx="14" fill="#1b2332"/>
    <text x="460" y="168" fill="#f8fafc" class="sans" font-size="19" font-weight="700" text-anchor="middle">
      🔗 Tap the Link Sticker below to get the code &amp; demo!
    </text>
  </g>

  <!-- BOTTOM WATERMARK -->
  <text x="540" y="1845" fill="#64748b" class="sans" font-size="18" font-weight="600" text-anchor="middle">
    Created by @PurohitBhagyesh • Free &amp; Open Source MIT
  </text>
</svg>
