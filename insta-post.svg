<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070a"/>
      <stop offset="50%" stop-color="#080c11"/>
      <stop offset="100%" stop-color="#030406"/>
    </linearGradient>

    <!-- Emerald / Matcha Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>

    <!-- Glass Card Gradients (Black & White Glass with Green Edge) -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121721" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#0a0e16" stop-opacity="0.88"/>
    </linearGradient>

    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="50%" stop-color="rgba(34,197,94,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.06)"/>
    </linearGradient>

    <!-- Boba Liquid Gradient (Matcha Milk Tea Style) -->
    <linearGradient id="bobaLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#166534" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#052e16" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Boba Pearl Gradient -->
    <radialGradient id="bobaPearl" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#020804"/>
    </radialGradient>

    <!-- Straw Gradient -->
    <linearGradient id="strawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Soft Ambient Lights -->
    <radialGradient id="glowTopLeft" cx="20%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowBoba" cx="80%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>

    <!-- Filter for Soft Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <!-- Deep Black Background Canvas -->
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect width="1080" height="1350" fill="url(#glowTopLeft)"/>
  <rect width="1080" height="1350" fill="url(#glowBoba)"/>

  <!-- ===================================================================== -->
  <!-- AESTHETIC BACKGROUND: STYLIZED BOBA TEA ART (RIGHT SIDE)               -->
  <!-- ===================================================================== -->
  <g transform="translate(680, 240)" opacity="0.45">
    <!-- Ambient Behind Boba -->
    <circle cx="160" cy="400" r="220" fill="url(#greenGrad)" opacity="0.12" filter="url(#softGlow)"/>

    <!-- Boba Straw (Diagonal Angled Up) -->
    <g transform="rotate(-18, 160, 100)">
      <rect x="148" y="-60" width="28" height="360" rx="14" fill="url(#strawGrad)" opacity="0.7"/>
      <line x1="158" y1="-50" x2="158" y2="280" stroke="#ffffff" stroke-width="2" opacity="0.35"/>
    </g>

    <!-- Boba Glass Cup Body -->
    <!-- Cup Rim / Lid -->
    <ellipse cx="160" cy="110" rx="140" ry="24" fill="#1e293b" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <ellipse cx="160" cy="106" rx="134" ry="20" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" opacity="0.6"/>

    <!-- Tapered Glass Cup Outline & Liquid Fill -->
    <path d="M26 110 L60 560 Q64 590 94 590 L226 590 Q256 590 260 560 L294 110 Z"
          fill="url(#bobaLiquid)" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>

    <!-- Ice Cubes inside Boba -->
    <rect x="90" y="190" width="56" height="56" rx="12" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" transform="rotate(12, 118, 218)"/>
    <rect x="170" y="240" width="60" height="60" rx="12" fill="none" stroke="rgba(74,222,128,0.25)" stroke-width="1.5" transform="rotate(-18, 200, 270)"/>

    <!-- Boba Pearls (Glossy Floating Spheres at Bottom) -->
    <circle cx="100" cy="520" r="20" fill="url(#bobaPearl)"/>
    <circle cx="140" cy="540" r="22" fill="url(#bobaPearl)"/>
    <circle cx="185" cy="535" r="21" fill="url(#bobaPearl)"/>
    <circle cx="225" cy="515" r="19" fill="url(#bobaPearl)"/>

    <circle cx="115" cy="480" r="20" fill="url(#bobaPearl)"/>
    <circle cx="160" cy="495" r="22" fill="url(#bobaPearl)"/>
    <circle cx="205" cy="475" r="20" fill="url(#bobaPearl)"/>

    <circle cx="135" cy="445" r="19" fill="url(#bobaPearl)"/>
    <circle cx="178" cy="450" r="21" fill="url(#bobaPearl)"/>

    <!-- Specular Glass Highlights (Reflections) -->
    <path d="M46 140 L74 530" stroke="#ffffff" stroke-width="3.5" opacity="0.25" stroke-linecap="round"/>
    <path d="M54 150 L78 480" stroke="#ffffff" stroke-width="1.5" opacity="0.15" stroke-linecap="round"/>
  </g>

  <!-- ===================================================================== -->
  <!-- TOP BAR                                                               -->
  <!-- ===================================================================== -->
  <g transform="translate(80, 80)">
    <!-- Brand Pill -->
    <rect width="180" height="38" rx="19" fill="#0d1117" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <circle cx="20" cy="19" r="4.5" fill="#22c55e"/>
    <text x="34" y="23.5" fill="#f8fafc" class="sans" font-size="12" font-weight="700" letter-spacing="0.08em">WEB ELEMENTS</text>

    <!-- Sub Tag -->
    <g transform="translate(680, 0)">
      <rect width="240" height="38" rx="19" fill="#0d1117" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
      <text x="120" y="23.5" fill="#4ade80" class="sans" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing="0.06em">FOR INDIE DEVELOPERS</text>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- HERO TITLE SECTION                                                    -->
  <!-- ===================================================================== -->
  <g transform="translate(80, 160)">
    <text x="0" y="24" fill="#22c55e" class="sans" font-size="12.5" font-weight="800" letter-spacing="0.14em">ZERO DEPENDENCIES • PURE VANILLA</text>
    <text x="0" y="80" fill="#ffffff" class="sans" font-size="52" font-weight="900" letter-spacing="-0.03em">Buy Me a Coffee (UPI)</text>
    <text x="0" y="118" fill="#94a3b8" class="sans" font-size="18" font-weight="400">
      Zero platform fees. Direct peer-to-peer settlement.
    </text>
  </g>

  <!-- ===================================================================== -->
  <!-- 3 AESTHETIC ELEMENTS / CARDS                                          -->
  <!-- ===================================================================== -->

  <!-- ELEMENT 1: BUY ME A COFFEE (UPI) -->
  <g transform="translate(80, 310)" filter="url(#cardShadow)">
    <rect width="920" height="230" rx="20" fill="url(#glassCard)" stroke="url(#glassBorder)" stroke-width="1.5"/>
    <line x1="24" y1="2" x2="896" y2="2" stroke="rgba(255,255,255,0.2)" stroke-width="1.2" stroke-linecap="round"/>

    <g transform="translate(40, 36)">
      <!-- Eyebrow Tag -->
      <g>
        <rect width="180" height="28" rx="14" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
        <text x="90" y="18" fill="#4ade80" class="sans" font-size="11" font-weight="800" text-anchor="middle">PEER-TO-PEER DONATION</text>
      </g>

      <!-- Element Title -->
      <text x="0" y="66" fill="#ffffff" class="sans" font-size="26" font-weight="800" letter-spacing="-0.02em">Buy Me a Coffee (UPI)</text>
      <text x="0" y="96" fill="#94a3b8" class="sans" font-size="14.5" font-weight="400">
        100% direct bank transfer. Dynamic real-time calculation. Zero intermediary cuts.
      </text>

      <!-- Supported UPI Apps Box (As Requested) -->
      <g transform="translate(0, 118)">
        <rect width="840" height="42" rx="10" fill="#0d1117" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <text x="20" y="26" fill="#4ade80" class="sans" font-size="12" font-weight="800" letter-spacing="0.04em">Supported UPI Apps</text>
        <text x="820" y="26" fill="#94a3b8" class="sans" font-size="12" font-weight="500" text-anchor="end">
          FamApp • PhonePe • Google Pay • Paytm • Amazon Pay • WhatsApp • BHIM
        </text>
      </g>
    </g>
  </g>

  <!-- ELEMENT 2: NATIVE WEB SHARE LINK -->
  <g transform="translate(80, 565)" filter="url(#cardShadow)">
    <rect width="920" height="230" rx="20" fill="url(#glassCard)" stroke="url(#glassBorder)" stroke-width="1.5"/>
    <line x1="24" y1="2" x2="896" y2="2" stroke="rgba(255,255,255,0.2)" stroke-width="1.2" stroke-linecap="round"/>

    <g transform="translate(40, 36)">
      <!-- Eyebrow Tag -->
      <g>
        <rect width="170" height="28" rx="14" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
        <text x="85" y="18" fill="#4ade80" class="sans" font-size="11" font-weight="800" text-anchor="middle">DEVICE &amp; SOCIAL SHARE</text>
      </g>

      <!-- Element Title -->
      <text x="0" y="66" fill="#ffffff" class="sans" font-size="26" font-weight="800" letter-spacing="-0.02em">Native Web Share Link</text>
      <text x="0" y="96" fill="#94a3b8" class="sans" font-size="14.5" font-weight="400">
        Triggers native device sheets on iOS, Android &amp; macOS Safari. 1-click clipboard copy.
      </text>

      <!-- Channels Pills -->
      <g transform="translate(0, 118)">
        <rect width="840" height="42" rx="10" fill="#0d1117" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <text x="20" y="26" fill="#ffffff" class="sans" font-size="12" font-weight="700">Quick Channels</text>
        <text x="820" y="26" fill="#94a3b8" class="sans" font-size="12" font-weight="500" text-anchor="end">
          AirDrop • Messages • WhatsApp • X / Twitter • LinkedIn • Reddit • Telegram
        </text>
      </g>
    </g>
  </g>

  <!-- ELEMENT 3: ZERO-DEPENDENCY RUNTIME & EDITABILITY -->
  <g transform="translate(80, 820)" filter="url(#cardShadow)">
    <rect width="920" height="230" rx="20" fill="url(#glassCard)" stroke="url(#glassBorder)" stroke-width="1.5"/>
    <line x1="24" y1="2" x2="896" y2="2" stroke="rgba(255,255,255,0.2)" stroke-width="1.2" stroke-linecap="round"/>

    <g transform="translate(40, 36)">
      <!-- Eyebrow Tag -->
      <g>
        <rect width="190" height="28" rx="14" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
        <text x="95" y="18" fill="#4ade80" class="sans" font-size="11" font-weight="800" text-anchor="middle">LIVE DYNAMIC EDITING</text>
      </g>

      <!-- Element Title -->
      <text x="0" y="66" fill="#ffffff" class="sans" font-size="26" font-weight="800" letter-spacing="-0.02em">Pure Vanilla Components</text>
      <text x="0" y="96" fill="#94a3b8" class="sans" font-size="14.5" font-weight="400">
        Zero npm packages. In-modal editing for Name, UPI ID &amp; Link. Light &amp; dark mode ready.
      </text>

      <!-- Spec Pills -->
      <g transform="translate(0, 118)">
        <rect width="840" height="42" rx="10" fill="#0d1117" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <text x="20" y="26" fill="#4ade80" class="sans" font-size="12" font-weight="800">Architecture</text>
        <text x="820" y="26" fill="#94a3b8" class="sans" font-size="12" font-weight="500" text-anchor="end">
          Pure JS &amp; CSS3 • ~4 KB Lightweight Bundle • CSS Custom Properties
        </text>
      </g>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- SMALL MINIMAL FOOTER                                                  -->
  <!-- ===================================================================== -->
  <g transform="translate(80, 1140)">
    <line x1="0" y1="0" x2="920" y2="0" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <g transform="translate(0, 36)">
      <!-- Left: Small Clean Repo URL -->
      <text x="0" y="16" fill="#64748b" class="sans" font-size="11" font-weight="700" letter-spacing="0.08em">OPEN SOURCE ON GITHUB</text>
      <text x="0" y="44" fill="#ffffff" class="mono" font-size="18" font-weight="700">github.com/PurohitBhagyesh/web-elements</text>

      <!-- Right: Developer Handle -->
      <g transform="translate(680, 0)">
        <text x="240" y="16" fill="#64748b" class="sans" font-size="11" font-weight="700" text-anchor="end" letter-spacing="0.08em">DEVELOPER</text>
        <text x="240" y="44" fill="#22c55e" class="sans" font-size="18" font-weight="800" text-anchor="end">@PurohitBhagyesh</text>
      </g>
    </g>
  </g>

  <!-- Bottom License Footnote -->
  <text x="540" y="1290" fill="#475569" class="sans" font-size="11" font-weight="600" text-anchor="middle">
    Free &amp; Open Source MIT • Zero Runtime Dependencies
  </text>
</svg>
