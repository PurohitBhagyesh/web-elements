<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="50%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>

    <!-- Emerald Accent Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>

    <!-- Blue Accent Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141824" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d111a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Inner Card Gradient -->
    <linearGradient id="innerCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181e2b"/>
      <stop offset="100%" stop-color="#10141e"/>
    </linearGradient>

    <!-- Soft Ambient Lights -->
    <radialGradient id="ambientGreen" cx="25%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ambientBlue" cx="80%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect width="1080" height="1350" fill="url(#ambientGreen)"/>
  <rect width="1080" height="1350" fill="url(#ambientBlue)"/>

  <!-- TOP BAR -->
  <g transform="translate(80, 80)">
    <!-- Brand Pill -->
    <rect width="190" height="42" rx="21" fill="#141824" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    <circle cx="24" cy="21" r="5" fill="#22c55e"/>
    <text x="38" y="27" fill="#f8fafc" class="sans" font-size="13" font-weight="700" letter-spacing="0.08em">WEB ELEMENTS</text>

    <!-- Developer Repo Pill -->
    <g transform="translate(600, 0)">
      <rect width="320" height="42" rx="21" fill="#141824" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
      <!-- GitHub Icon -->
      <path d="M22 21c0-4.97-4.03-9-9-9s-9 4.03-9 9c0 3.98 2.58 7.35 6.15 8.54.45.08.61-.2.61-.43 0-.21-.01-.78-.01-1.53-2.5.54-3.03-1.21-3.03-1.21-.41-1.04-1-1.32-1-1.32-.82-.56.06-.55.06-.55.9.06 1.38.93 1.38.93.8 1.37 2.1 0.98 2.62.75.08-.58.31-.98.57-1.2-2-.23-4.1-1-4.1-4.45 0-.98.35-1.78.93-2.41-.09-.23-.4-1.14.09-2.38 0 0 .75-.24 2.47.92.72-.2 1.49-.3 2.25-.3.76 0 1.53.1 2.25.3 1.72-1.16 2.47-.92 2.47-.92.49 1.24.18 2.15.09 2.38.58.63.93 1.43.93 2.41 0 3.46-2.1 4.22-4.11 4.44.32.28.61.83.61 1.67 0 1.21-.01 2.18-.01 2.48 0 .24.16.52.62.43C19.42 28.35 22 24.98 22 21z" fill="#94a3b8" transform="translate(14, 0) scale(0.9)"/>
      <text x="52" y="26" fill="#94a3b8" class="mono" font-size="12" font-weight="600">github.com/PurohitBhagyesh</text>
    </g>
  </g>

  <!-- HERO SECTION -->
  <g transform="translate(80, 160)">
    <!-- Small Category Eyebrow -->
    <text x="0" y="24" fill="#22c55e" class="sans" font-size="13" font-weight="800" letter-spacing="0.14em">FOR INDIE DEVELOPERS &amp; CREATORS</text>

    <!-- Main Title -->
    <text x="0" y="86" fill="#ffffff" class="sans" font-size="58" font-weight="900" letter-spacing="-0.03em">Buy Me a Coffee</text>
    <text x="500" y="86" fill="url(#emeraldGrad)" class="sans" font-size="58" font-weight="900" letter-spacing="-0.03em">(UPI)</text>

    <!-- Tagline -->
    <text x="0" y="128" fill="#94a3b8" class="sans" font-size="20" font-weight="400">
      0% platform fees. Instant settlement directly to your bank account.
    </text>
  </g>

  <!-- CARD 1: THE COFFEE UPI WIDGET SHOWCASE -->
  <g transform="translate(80, 325)">
    <!-- Glass Container -->
    <rect width="920" height="490" rx="28" fill="url(#cardBg)" stroke="rgba(34,197,94,0.32)" stroke-width="1.8"/>

    <!-- Left Details Column -->
    <g transform="translate(48, 48)">
      <!-- Badge Row -->
      <g>
        <rect width="130" height="32" rx="16" fill="rgba(34,197,94,0.14)" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
        <text x="65" y="21" fill="#4ade80" class="sans" font-size="12" font-weight="800" text-anchor="middle">INSTANT UPI</text>

        <rect x="142" y="0" width="165" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
        <text x="224" y="21" fill="#cbd5e1" class="sans" font-size="12" font-weight="700" text-anchor="middle">ZERO COMMISSIONS</text>
      </g>

      <!-- Headline -->
      <text x="0" y="80" fill="#ffffff" class="sans" font-size="28" font-weight="800" letter-spacing="-0.02em">Direct Peer-to-Peer Support</text>
      <text x="0" y="112" fill="#94a3b8" class="sans" font-size="15" font-weight="400">Scan with any mobile app or tap to deep-link on phone.</text>

      <!-- Amount Selector Preset Chips -->
      <g transform="translate(0, 142)">
        <text x="0" y="-8" fill="#64748b" class="sans" font-size="11" font-weight="700" letter-spacing="0.08em">SELECT TIP AMOUNT</text>

        <!-- Chip 1 -->
        <rect x="0" y="4" width="95" height="44" rx="12" fill="#181e2b" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
        <text x="47" y="32" fill="#cbd5e1" class="sans" font-size="16" font-weight="700" text-anchor="middle">₹20</text>

        <!-- Chip 2 (Active) -->
        <rect x="108" y="4" width="160" height="44" rx="12" fill="#22c55e"/>
        <text x="188" y="32" fill="#000000" class="sans" font-size="16" font-weight="800" text-anchor="middle">₹50 (1 Coffee)</text>

        <!-- Chip 3 -->
        <rect x="280" y="4" width="95" height="44" rx="12" fill="#181e2b" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
        <text x="327" y="32" fill="#cbd5e1" class="sans" font-size="16" font-weight="700" text-anchor="middle">₹100</text>

        <!-- Chip 4 -->
        <rect x="388" y="4" width="95" height="44" rx="12" fill="#181e2b" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
        <text x="435" y="32" fill="#cbd5e1" class="sans" font-size="16" font-weight="700" text-anchor="middle">₹200</text>
      </g>

      <!-- Feature Bullets (Clean & Minimal) -->
      <g transform="translate(0, 240)">
        <g transform="translate(0, 0)">
          <circle cx="8" cy="8" r="4" fill="#22c55e"/>
          <text x="24" y="12" fill="#e2e8f0" class="sans" font-size="14.5" font-weight="600">Dynamic amount QR code synced in real time</text>
        </g>
        <g transform="translate(0, 32)">
          <circle cx="8" cy="8" r="4" fill="#22c55e"/>
          <text x="24" y="12" fill="#e2e8f0" class="sans" font-size="14.5" font-weight="600">Live editable Name &amp; UPI ID in modal UI</text>
        </g>
        <g transform="translate(0, 64)">
          <circle cx="8" cy="8" r="4" fill="#22c55e"/>
          <text x="24" y="12" fill="#e2e8f0" class="sans" font-size="14.5" font-weight="600">No merchant KYC • No platform lock-in</text>
        </g>
      </g>
    </g>

    <!-- Right QR Code Mockup Box -->
    <g transform="translate(636, 44)">
      <rect width="236" height="276" rx="20" fill="url(#innerCard)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

      <!-- Clean Minimal QR Code Graphic -->
      <g transform="translate(36, 32)">
        <rect width="164" height="164" rx="12" fill="#ffffff"/>
        <!-- QR Finder Patterns -->
        <!-- Top Left -->
        <rect x="14" y="14" width="40" height="40" rx="6" fill="#000000"/>
        <rect x="22" y="22" width="24" height="24" rx="3" fill="#ffffff"/>
        <rect x="28" y="28" width="12" height="12" rx="2" fill="#000000"/>

        <!-- Top Right -->
        <rect x="110" y="14" width="40" height="40" rx="6" fill="#000000"/>
        <rect x="118" y="22" width="24" height="24" rx="3" fill="#ffffff"/>
        <rect x="124" y="28" width="12" height="12" rx="2" fill="#000000"/>

        <!-- Bottom Left -->
        <rect x="14" y="110" width="40" height="40" rx="6" fill="#000000"/>
        <rect x="22" y="118" width="24" height="24" rx="3" fill="#ffffff"/>
        <rect x="28" y="124" width="12" height="12" rx="2" fill="#000000"/>

        <!-- Simulated Data Pixels -->
        <rect x="64" y="18" width="8" height="18" fill="#000"/>
        <rect x="76" y="24" width="16" height="8" fill="#000"/>
        <rect x="68" y="44" width="24" height="8" fill="#000"/>
        <rect x="18" y="66" width="18" height="8" fill="#000"/>
        <rect x="44" y="66" width="24" height="16" fill="#000"/>
        <rect x="74" y="66" width="14" height="14" fill="#000"/>
        <rect x="96" y="64" width="12" height="18" fill="#000"/>
        <rect x="118" y="66" width="26" height="10" fill="#000"/>
        <rect x="18" y="86" width="16" height="14" fill="#000"/>
        <rect x="44" y="92" width="18" height="10" fill="#000"/>
        <rect x="72" y="90" width="20" height="20" fill="#000"/>
        <rect x="100" y="94" width="24" height="8" fill="#000"/>
        <rect x="134" y="88" width="14" height="18" fill="#000"/>
        <rect x="64" y="118" width="16" height="26" fill="#000"/>
        <rect x="90" y="122" width="20" height="8" fill="#000"/>
        <rect x="118" y="116" width="28" height="14" fill="#000"/>
        <rect x="92" y="136" width="14" height="14" fill="#000"/>
        <rect x="122" y="138" width="24" height="12" fill="#000"/>
      </g>

      <text x="118" y="228" fill="#f8fafc" class="sans" font-size="12" font-weight="700" text-anchor="middle">SCAN WITH ANY UPI APP</text>
      <text x="118" y="248" fill="#4ade80" class="mono" font-size="11.5" font-weight="600" text-anchor="middle">upi://pay?cu=INR</text>
    </g>

    <!-- Bottom App Integration Strip inside Card 1 -->
    <g transform="translate(48, 386)">
      <line x1="0" y1="0" x2="824" y2="0" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

      <!-- 6 App Pills -->
      <g transform="translate(0, 20)">
        <!-- FamApp -->
        <rect x="0" y="0" width="124" height="42" rx="10" fill="#181e2b" stroke="rgba(255,255,255,0.08)"/>
        <text x="62" y="26" fill="#f59e0b" class="sans" font-size="13" font-weight="700" text-anchor="middle">FamApp</text>

        <!-- PhonePe -->
        <rect x="140" y="0" width="124" height="42" rx="10" fill="#181e2b" stroke="rgba(255,255,255,0.08)"/>
        <text x="202" y="26" fill="#a855f7" class="sans" font-size="13" font-weight="700" text-anchor="middle">PhonePe</text>

        <!-- Google Pay -->
        <rect x="280" y="0" width="124" height="42" rx="10" fill="#181e2b" stroke="rgba(255,255,255,0.08)"/>
        <text x="342" y="26" fill="#38bdf8" class="sans" font-size="13" font-weight="700" text-anchor="middle">Google Pay</text>

        <!-- Paytm -->
        <rect x="420" y="0" width="124" height="42" rx="10" fill="#181e2b" stroke="rgba(255,255,255,0.08)"/>
        <text x="482" y="26" fill="#0ea5e9" class="sans" font-size="13" font-weight="700" text-anchor="middle">Paytm</text>

        <!-- Amazon Pay -->
        <rect x="560" y="0" width="124" height="42" rx="10" fill="#181e2b" stroke="rgba(255,255,255,0.08)"/>
        <text x="622" y="26" fill="#f97316" class="sans" font-size="13" font-weight="700" text-anchor="middle">Amazon Pay</text>

        <!-- WhatsApp -->
        <rect x="700" y="0" width="124" height="42" rx="10" fill="#181e2b" stroke="rgba(255,255,255,0.08)"/>
        <text x="762" y="26" fill="#22c55e" class="sans" font-size="13" font-weight="700" text-anchor="middle">WhatsApp</text>
      </g>
    </g>
  </g>

  <!-- CARD 2: NATIVE WEB SHARE LINK -->
  <g transform="translate(80, 845)">
    <rect width="920" height="260" rx="28" fill="url(#cardBg)" stroke="rgba(59,130,246,0.3)" stroke-width="1.8"/>

    <g transform="translate(48, 40)">
      <!-- Eyebrow Tag -->
      <rect width="175" height="30" rx="15" fill="rgba(59,130,246,0.14)" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
      <text x="87" y="20" fill="#60a5fa" class="sans" font-size="11.5" font-weight="800" text-anchor="middle">VIRAL DISTRIBUTION</text>

      <!-- Headline -->
      <text x="0" y="74" fill="#ffffff" class="sans" font-size="28" font-weight="800" letter-spacing="-0.02em">Native Web Share Link</text>
      <text x="0" y="104" fill="#94a3b8" class="sans" font-size="15" font-weight="400">Triggers native device sheets on iOS, Android &amp; macOS (AirDrop, Messages).</text>

      <!-- Channels Pills -->
      <g transform="translate(0, 134)">
        <rect x="0" y="0" width="118" height="38" rx="10" fill="#181e2b" stroke="rgba(255,255,255,0.08)"/>
        <text x="59" y="24" fill="#f8fafc" class="sans" font-size="12.5" font-weight="600" text-anchor="middle">AirDrop ↗</text>

        <rect x="130" y="0" width="134" height="38" rx="10" fill="#181e2b" stroke="rgba(255,255,255,0.08)"/>
        <text x="197" y="24" fill="#22c55e" class="sans" font-size="12.5" font-weight="600" text-anchor="middle">WhatsApp</text>

        <rect x="276" y="0" width="118" height="38" rx="10" fill="#181e2b" stroke="rgba(255,255,255,0.08)"/>
        <text x="335" y="24" fill="#f8fafc" class="sans" font-size="12.5" font-weight="600" text-anchor="middle">X / Twitter</text>

        <rect x="406" y="0" width="120" height="38" rx="10" fill="#181e2b" stroke="rgba(255,255,255,0.08)"/>
        <text x="466" y="24" fill="#0a66c2" class="sans" font-size="12.5" font-weight="600" text-anchor="middle">LinkedIn</text>

        <rect x="538" y="0" width="118" height="38" rx="10" fill="#181e2b" stroke="rgba(255,255,255,0.08)"/>
        <text x="597" y="24" fill="#ff4500" class="sans" font-size="12.5" font-weight="600" text-anchor="middle">Reddit</text>

        <rect x="668" y="0" width="156" height="38" rx="10" fill="#181e2b" stroke="rgba(34,197,94,0.3)"/>
        <text x="746" y="24" fill="#4ade80" class="sans" font-size="12.5" font-weight="700" text-anchor="middle">1-Click Copy ✓</text>
      </g>
    </g>
  </g>

  <!-- CLEAN BOTTOM BAR: REPO LINK & PROFILE (NO BASH, NO STAR) -->
  <g transform="translate(80, 1140)">
    <rect width="920" height="130" rx="24" fill="url(#innerCard)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>

    <g transform="translate(44, 42)">
      <!-- Left: Repository URL -->
      <text x="0" y="22" fill="#64748b" class="sans" font-size="12" font-weight="700" letter-spacing="0.08em">OPEN SOURCE REPOSITORY</text>
      <text x="0" y="52" fill="#ffffff" class="mono" font-size="21" font-weight="700">github.com/PurohitBhagyesh/web-elements</text>

      <!-- Right: Creator Tag -->
      <g transform="translate(620, -6)">
        <rect width="210" height="60" rx="16" fill="#1e2536" stroke="rgba(34,197,94,0.3)" stroke-width="1.2"/>
        <text x="105" y="26" fill="#94a3b8" class="sans" font-size="11" font-weight="600" text-anchor="middle">CREATED BY</text>
        <text x="105" y="46" fill="#22c55e" class="sans" font-size="15" font-weight="800" text-anchor="middle">@PurohitBhagyesh</text>
      </g>
    </g>
  </g>

  <!-- FOOTER COPYRIGHT -->
  <text x="540" y="1310" fill="#475569" class="sans" font-size="12" font-weight="600" text-anchor="middle">
    Free &amp; Open Source MIT • Zero Runtime Dependencies • Vanilla JavaScript &amp; CSS3
  </text>
</svg>
